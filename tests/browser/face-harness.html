<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>SARMAD Attendance - face engine browser test</title>
    <style>
        body { background: #0b1020; color: #e6ecff; font-family: Tahoma, sans-serif; margin: 0; padding: 16px; }
        canvas, img { border: 1px solid #24304a; margin: 4px; }
        #log { white-space: pre-wrap; font-size: 12px; }
    </style>
</head>
<body>
<h1>SARMAD Attendance - local face engine test harness</h1>
<p id="status">loading…</p>
<pre id="log"></pre>

<!-- The REAL shipped libraries and the REAL shipped engine file: nothing is
     mocked here, the harness only drives them and reports measurements. -->
<script src="/assets/vendor/tfjs-1.7.4.min.js"></script>
<script src="/assets/vendor/face-api-0.22.2.min.js"></script>
<script src="/assets/js/face/face-engine.js"></script>

<script>
(function () {
    'use strict';

    var log = document.getElementById('log');
    var status = document.getElementById('status');

    function say(line) {
        log.textContent += line + '\n';
    }

    /** Load a fixture image (served by the test harness on the same origin). */
    function loadImage(name) {
        return new Promise(function (resolve, reject) {
            var img = new Image();
            img.onload = function () { resolve(img); };
            img.onerror = function () { reject(new Error('image failed: ' + name)); };
            img.src = '/__face_test__/fixtures/' + name;
        });
    }

    /**
     * Frame a photo the way the enrolment wizard / kiosk frame expects the
     * person to stand: detect the face once, then crop a square around it.
     * (Quality gates are tested separately on the RAW photos.)
     */
    function framedCanvas(img) {
        return window.SarmadFace.detectFaces(img, { inputSize: 320 }).then(function (faces) {
            var canvas = document.createElement('canvas');

            if (!faces.length) {
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                canvas.getContext('2d').drawImage(img, 0, 0);

                return canvas;
            }

            var box = faces[0].box;
            // Detection coordinates belong to the (possibly downscaled) canvas;
            // map them back onto the original photo before cropping.
            var ratio = img.naturalWidth / (faces[0].frame.width || img.naturalWidth);
            var side = Math.max(box.width, box.height) * 2.6 * ratio;
            var cx = (box.x + box.width / 2) * ratio;
            var cy = (box.y + box.height / 2) * ratio;
            var size = Math.max(320, Math.round(side));

            canvas.width = size;
            canvas.height = size;
            canvas.getContext('2d').drawImage(img, cx - side / 2, cy - side / 2, side, side, 0, 0, size, size);

            return canvas;
        });
    }

    function imageToCanvas(img) {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);

        return canvas;
    }

    function round(value, digits) {
        var factor = Math.pow(10, digits || 3);

        return Math.round(value * factor) / factor;
    }

    /** Full test run - returns a plain JSON object (no DOM handles). */
    window.runFaceTests = function (options) {
        var config = options.config || {};
        var out = {
            engine: null,
            backend: null,
            model_load_ms: 0,
            detect_ms: {},
            embed_ms: {},
            detections: {},
            enroll: {},
            distances: {},
            decisions: {},
            quality: {},
            ambiguity: {},
            performance: {},
            errors: []
        };

        var engine = window.SarmadFace;

        engine.configure(config);

        var t0 = performance.now();

        return engine.loadModels().then(function (report) {
            out.model_load_ms = Math.round(performance.now() - t0);
            out.engine = report.ok ? 'loaded' : 'failed';
            out.backend = report.backend;
            out.detector = report.detector;
            out.model_version = config.model_version || null;
            out.load_detail = report.detail || null;

            if (!report.ok) {
                throw new Error('model load failed: ' + (report.detail || report.code));
            }

            /* ---------------- detection counts ---------------- */
            var detectionPlan = {
                single_a: 'enroll_a_1.jpg',
                single_b: 'enroll_b_1.jpg',
                verification_a: 'verify_a.jpg',
                multi: 'multi.jpg',
                multi_natural: 'multi_check.jpg',
                no_face: 'no_face.jpg',
                unknown: 'unknown_1.jpg'
            };

            var chain = Promise.resolve();

            Object.keys(detectionPlan).forEach(function (key) {
                chain = chain.then(function () {
                    return loadImage(detectionPlan[key]).then(function (img) {
                        var start = performance.now();

                        return engine.detectFaces(img, { inputSize: config.detector_input_size || 320 }).then(function (faces) {
                            out.detect_ms[key] = Math.round(performance.now() - start);
                            out.detections[key] = faces.length;

                            return faces;
                        });
                    });
                });
            });

            /* ---------------- enrolment samples ---------------- */
            var enrollPlan = [
                ['a_1', 'enroll_a_1.jpg'],
                ['a_2', 'enroll_a_2.jpg'],
                ['a_3', 'enroll_a_3.jpg'],
                ['b_1', 'enroll_b_1.jpg'],
                ['b_2', 'enroll_b_2.jpg'],
                ['b_3', 'enroll_b_3.jpg'],
                ['unknown_1', 'unknown_1.jpg'],
                ['unknown_2', 'unknown_2.jpg']
            ];

            enrollPlan.forEach(function (item) {
                chain = chain.then(function () {
                    return loadImage(item[1]).then(function (img) {
                        return framedCanvas(img).then(function (canvas) {
                        var start = performance.now();

                        return engine.captureSample(canvas).then(function (sample) {
                            out.embed_ms[item[0]] = Math.round(performance.now() - start);
                            out.enroll[item[0]] = {
                                ok: sample.ok,
                                code: sample.code,
                                quality: sample.quality || null,
                                dimensions: sample.embedding ? sample.embedding.length : 0
                            };

                            out['__emb_' + item[0]] = sample.embedding || null;
                            out['__quality_' + item[0]] = sample.quality || null;

                            return sample;
                        });
                        });
                    });
                });
            });

            /* ---------------- distances + decisions ---------------- */
            chain = chain.then(function () {
                var e = {
                    a: [out.__emb_a_1, out.__emb_a_2, out.__emb_a_3],
                    b: [out.__emb_b_1, out.__emb_b_2, out.__emb_b_3],
                    u: [out.__emb_unknown_1, out.__emb_unknown_2]
                };

                function avg(pairs) {
                    var usable = pairs.filter(function (pair) {
                        return pair[0] && pair[1] && pair[0].length && pair[1].length;
                    });

                    if (usable.length === 0) {
                        return { min: null, median: null, max: null, values: [], missing: pairs.length };
                    }

                    var values = usable.map(function (pair) {
                        return engine.euclidean(pair[0], pair[1]);
                    });

                    values.sort(function (x, y) { return x - y; });

                    return {
                        min: round(values[0], 4),
                        median: round(values[Math.floor(values.length / 2)], 4),
                        max: round(values[values.length - 1], 4),
                        values: values.map(function (v) { return round(v, 4); }),
                        missing: pairs.length - usable.length
                    };
                }

                out.distances.intra_a = avg([[e.a[0], e.a[1]], [e.a[0], e.a[2]], [e.a[1], e.a[2]]]);
                out.distances.intra_b = avg([[e.b[0], e.b[1]], [e.b[0], e.b[2]], [e.b[1], e.b[2]]]);

                var cross = [];

                e.a.forEach(function (a) {
                    e.b.forEach(function (b) {
                        cross.push([a, b]);
                    });
                });

                out.distances.inter_ab = avg(cross);

                var unknownCross = [];

                e.a.forEach(function (a) {
                    e.u.forEach(function (u) {
                        unknownCross.push([a, u]);
                    });
                });

                out.distances.inter_a_unknown = avg(unknownCross);

                // A rotated / re-photographed frame of the same person must
                // still land close to the enrolled descriptors.
                return loadImage('verify_a_rotated.jpg').then(function (img) {
                    return framedCanvas(img).then(function (canvas) {
                    return engine.captureSample(canvas).then(function (sample) {
                        out.rotated_sample_ok = sample.ok;
                        out.rotated_sample_code = sample.code;

                        if (sample.ok) {
                            out.distances.rotated_a = avg(e.a.map(function (a) {
                                return [a, sample.embedding];
                            }));
                        } else {
                            out.distances.rotated_a = { min: null, median: null, max: null, values: [], reason: sample.code };
                        }

                        return sample;
                    });
                    });
                });
            });

            /* ---------------- gallery + match decisions ---------------- */
            chain = chain.then(function () {
                var gallery = [];

                if (out.__emb_a_1 && out.__emb_a_2 && out.__emb_a_3) {
                    gallery.push({
                        employee_id: 101,
                        samples: [
                            { sample_index: 1, embedding: out.__emb_a_1 },
                            { sample_index: 2, embedding: out.__emb_a_2 },
                            { sample_index: 3, embedding: out.__emb_a_3 }
                        ]
                    });
                }

                if (out.__emb_b_1 && out.__emb_b_2 && out.__emb_b_3) {
                    gallery.push({
                        employee_id: 202,
                        samples: [
                            { sample_index: 1, embedding: out.__emb_b_1 },
                            { sample_index: 2, embedding: out.__emb_b_2 },
                            { sample_index: 3, embedding: out.__emb_b_3 }
                        ]
                    });
                }

                out.gallery_employees = gallery.map(function (item) { return item.employee_id; });

                var plan = [
                    ['verify_a', 'verify_a.jpg', 101],
                    ['verify_b', 'verify_b.jpg', 202],
                    ['unknown_1', 'unknown_1.jpg', null],
                    ['unknown_2', 'unknown_2.jpg', null],
                    ['rotated_a', 'verify_a_rotated.jpg', 101]
                ];

                var sub = Promise.resolve();

                plan.forEach(function (item) {
                    sub = sub.then(function () {
                        return loadImage(item[1]).then(function (img) {
                            return framedCanvas(img).then(function (canvas) {
                            return engine.captureSample(canvas).then(function (sample) {
                                if (!sample.ok) {
                                    out.decisions[item[0]] = {
                                        decision: 'sample_rejected',
                                        code: sample.code,
                                        expected_employee: item[2]
                                    };

                                    return sample;
                                }

                                var match = engine.match(sample.embedding, gallery);

                                out.decisions[item[0]] = {
                                    decision: match.decision,
                                    code: match.code,
                                    best_employee: match.best ? match.best.employee_id : null,
                                    best_distance: match.best ? round(match.best.distance, 4) : null,
                                    similarity: match.best ? round(match.best.similarity, 4) : null,
                                    second_distance: match.second ? round(match.second.distance, 4) : null,
                                    expected_employee: item[2]
                                };

                                return sample;
                            });
                            });
                        });
                    });
                });

                return sub;
            });

            /* ---------------- quality gates ---------------- */
            chain = chain.then(function () {
                var plan = [
                    ['blur', 'verify_a_blur.jpg'],
                    ['dark', 'verify_a_dark.jpg'],
                    ['small', 'verify_a_small.jpg'],
                    ['off_center', 'enroll_a_3.jpg'],
                    ['raw_portrait', 'verify_a.jpg']
                ];

                var sub = Promise.resolve();

                plan.forEach(function (item) {
                    sub = sub.then(function () {
                        return loadImage(item[1]).then(function (img) {
                            return engine.captureSample(img).then(function (sample) {
                                out.quality[item[0]] = {
                                    ok: sample.ok,
                                    code: sample.code,
                                    metrics: sample.quality || null
                                };

                                return sample;
                            });
                        });
                    });
                });

                return sub;
            });

            /* ---------------- ambiguity branch ---------------- */
            chain = chain.then(function () {
                var base = out.__emb_a_1;

                if (!base) {
                    out.ambiguity = { skipped: 'no embedding for employee A' };

                    return null;
                }
                var near = base.map(function (value, index) {
                    return value + (index % 2 === 0 ? 0.0015 : -0.0015);
                });

                var gallery = [
                    { employee_id: 1, samples: [{ sample_index: 1, embedding: base }] },
                    { employee_id: 2, samples: [{ sample_index: 1, embedding: near }] }
                ];

                var match = engine.match(base, gallery);

                out.ambiguity = {
                    decision: match.decision,
                    code: match.code,
                    best_distance: match.best ? round(match.best.distance, 5) : null,
                    second_distance: match.second ? round(match.second.distance, 5) : null,
                    margin: match.ambiguity_margin
                };

                // Same gallery but the runner up is far away -> must match.
                var far = base.map(function (value) { return value * -1; });
                var match2 = engine.match(base, [
                    { employee_id: 1, samples: [{ sample_index: 1, embedding: base }] },
                    { employee_id: 2, samples: [{ sample_index: 1, embedding: far }] }
                ]);

                out.ambiguity.control_decision = match2.decision;
                out.ambiguity.control_code = match2.code;

                return null;
            });

            /* ---------------- performance + memory ---------------- */
            chain = chain.then(function () {
                var memory = performance.memory || null;

                out.performance = {
                    user_agent: navigator.userAgent,
                    hardware_threads: navigator.hardwareConcurrency || null,
                    device_memory_gb: navigator.deviceMemory || null,
                    js_heap_mb: memory ? round(memory.usedJSHeapSize / 1048576, 1) : null,
                    js_heap_limit_mb: memory ? round(memory.jsHeapSizeLimit / 1048576, 1) : null,
                    tf_backend: window.tf && window.tf.getBackend ? window.tf.getBackend() : null,
                    tf_tensors: window.tf && window.tf.memory ? window.tf.memory().numTensors : null
                };

                out.status_report = engine.status();

                return null;
            });

            return chain.then(function () {
                // Never return the raw vectors over the wire: only lengths and
                // measurements (the vectors stay in the page).
                Object.keys(out).forEach(function (key) {
                    if (key.indexOf('__emb_') === 0 || key.indexOf('__quality_') === 0) {
                        delete out[key];
                    }
                });

                return out;
            });
        })['catch'](function (error) {
            out.errors.push(String(error && error.message ? error.message : error));

            return out;
        });
    };

    status.textContent = 'ready';
    document.title = 'ready';
})(window, document);
</script>
</body>
</html>
